<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:dark;--bg:#0b0618;--gold:#ffc61a;--fire:#ff5a1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 100%,#ff5a1f77,transparent 65%),radial-gradient(ellipse at 20% 0%,#3b1d8f99,transparent 60%),var(--bg);color:#fff6e8;font-family:"Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2.5svh,22px);padding:12px 16px;overflow-x:hidden}
.pic{flex:0 1 auto;min-height:0;display:flex;justify-content:center}
.pic img{max-height:74svh;max-width:100%;width:auto;height:auto;display:block;border-radius:22px;border:3px solid var(--gold);box-shadow:0 0 70px #ff5a1fbb,0 0 0 6px #ffc61a22;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.btn{position:relative;overflow:hidden;display:inline-block;padding:16px 48px;border-radius:99px;background:linear-gradient(180deg,#ffe066,#ffb300 55%,#ff8a00);color:#3a1500;font:900 22px Impact,"Arial Black",sans-serif;letter-spacing:1px;text-transform:uppercase;text-decoration:none;box-shadow:0 6px 0 #a85a00,0 12px 36px #ff8a00aa;animation:pulse 1.8s infinite}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#fff9,transparent);transform:skewX(-20deg);animation:shine 2.8s infinite}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a85a00}
@keyframes pulse{50%{transform:scale(1.05)}}
@keyframes shine{to{left:130%}}
small{font-size:11px;color:#c9b8d9;text-align:center}
small b{color:var(--gold)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
